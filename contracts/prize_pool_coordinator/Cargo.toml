[package]
name = "prize_pool_coordinator"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
entry_token = { path = "../entry_token" }
fee_vault = { path = "../fee_vault" }
