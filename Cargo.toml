[workspace]
resolver = "2"
members = [
  "contracts/prize_pool_coordinator",
  "contracts/entry_token",
  "contracts/fee_vault",
]

[workspace.dependencies]
soroban-sdk = "26"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
